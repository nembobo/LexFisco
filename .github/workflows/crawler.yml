name: LexFisco Weekly Crawler

on:
  schedule:
    - cron: '0 7 * * 1'  # Ogni lunedì alle 08:00 ora italiana
  workflow_dispatch:       # Permette lancio manuale da GitHub

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv feedparser pymupdf

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python crawler.py
