name: LexFisco Crawler Settimanale

on:
  schedule:
    - cron: '0 7 * * 1'  # Ogni lunedì alle 08:00 ora italiana (07:00 UTC)
  workflow_dispatch:       # Permette anche avvio manuale da GitHub

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests beautifulsoup4 python-dotenv feedparser

      - name: Esegui il crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python crawler.py
